{% extends "base.html" %}
{% block title %}错误 · sub2api 用量{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto mt-12">
  <div class="card p-5 sm:p-8">
    <div class="flex items-start gap-3 mb-6">
      <div class="flex-shrink-0 w-10 h-10 rounded-full bg-red-100 flex items-center justify-center">
        <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <div class="flex-1">
        <h1 class="text-lg font-bold text-red-700 mb-1">请求 sub2api 失败</h1>
        <div class="text-sm text-slate-600">HTTP 状态：<span class="font-mono font-medium text-slate-900">{{ status
            }}</span></div>
      </div>
    </div>

    <div class="text-sm text-slate-800 bg-slate-50 p-4 rounded-lg border border-slate-200 mb-6 font-mono text-xs break-words whitespace-pre-wrap">
      {{ message }}
    </div>

    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <a href="/" class="btn-primary text-center">回到仪表盘</a>
      <a href="javascript:history.back()" class="btn-secondary text-center">返回</a>
    </div>

    <div class="text-xs text-slate-600 leading-relaxed bg-blue-50 border border-blue-100 rounded-lg p-4">
      <div class="font-semibold text-blue-900 mb-2">💡 故障排查提示</div>
      <ul class="list-disc pl-5 space-y-1 break-words">
        <li>401 / 403 通常表示 <code class="bg-white px-1.5 py-0.5 rounded text-blue-700">SUB2API_ADMIN_KEY</code> 错误或权限不足
        </li>
        <li>5xx 表示 sub2api 服务异常，可登录管理后台排查</li>
        <li>连接错误请检查 <code class="bg-white px-1.5 py-0.5 rounded text-blue-700">SUB2API_BASE_URL</code> 是否能从本机访问</li>
      </ul>
    </div>
  </div>
</div>
{% endblock %}
