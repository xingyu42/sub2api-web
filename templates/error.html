{% extends "base.html" %}
{% block title %}错误 · sub2api 用量{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto mt-12 bg-white p-8 rounded-xl border border-zinc-200">
  <h1 class="text-lg font-semibold text-red-700 mb-2">请求 sub2api 失败</h1>
  <div class="text-sm text-zinc-600 mb-1">HTTP 状态：<span class="font-mono">{{ status }}</span></div>
  <div class="text-sm text-zinc-800 bg-zinc-50 p-3 rounded border border-zinc-200 mt-3">{{ message }}</div>
  <div class="mt-6 flex gap-3">
    <a href="/" class="px-4 py-2 bg-zinc-900 text-white text-sm rounded hover:bg-zinc-700">回到仪表盘</a>
    <a href="javascript:history.back()" class="px-4 py-2 border border-zinc-300 text-sm rounded hover:bg-zinc-100">返回</a>
  </div>
  <div class="text-xs text-zinc-500 mt-6 leading-relaxed">
    提示：
    <ul class="list-disc pl-5 mt-1">
      <li>401 / 403 通常表示 <code>SUB2API_ADMIN_KEY</code> 错误或权限不足。</li>
      <li>5xx 表示 sub2api 服务异常，可登录管理后台排查。</li>
      <li>连接错误请检查 <code>SUB2API_BASE_URL</code> 是否能从本机访问。</li>
    </ul>
  </div>
</div>
{% endblock %}
