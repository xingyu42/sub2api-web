{% extends "base.html" %}
{% block title %}API Keys · sub2api 用量{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-xl font-semibold">API Keys</h1>
    <p class="text-sm text-zinc-500 mt-1">跨用户聚合，共 {{ total|fmt_int }} 个 Key · 按累计费用降序</p>
  </div>
  <button
    class="inline-flex items-center gap-1.5 px-3 py-2 text-sm text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 rounded-lg transition-colors"
    title="刷新数据" id="refresh-btn">
    <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10" />
      <polyline points="1 20 1 14 7 14" />
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
    </svg>
    刷新
  </button>
</div>

{% include "api_keys_table.html" %}

{% endblock %}

{% block scripts %}
<script src="/static/js/api_keys.js"></script>
{% endblock %}
