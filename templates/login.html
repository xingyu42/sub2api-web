{% extends "base.html" %}
{% block title %}登录 · sub2api 用量{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-20 bg-white p-8 rounded-xl shadow border border-zinc-200">
  <h1 class="text-xl font-semibold mb-6">sub2api 用量管理</h1>
  {% if error %}
  <div class="mb-4 p-3 rounded bg-red-50 text-red-700 text-sm border border-red-200">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm text-zinc-600 mb-1">访问密码</label>
      <input type="password" name="password" autofocus required
             class="w-full px-3 py-2 border border-zinc-300 rounded-md focus:ring-2 focus:ring-zinc-500 focus:outline-none">
    </div>
    <button type="submit"
            class="w-full bg-zinc-900 text-white py-2 rounded-md hover:bg-zinc-700 text-sm font-medium">
      登录
    </button>
  </form>
</div>
{% endblock %}
