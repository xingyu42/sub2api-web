{% extends "base.html" %}
{% block title %}登录 · sub2api 用量{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
  <div class="card p-8 sm:p-10">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-2">sub2api</h1>
      <p class="text-sm text-slate-600">用量管理系统</p>
    </div>

    {% if error %}
    <div class="mb-6 p-4 rounded-lg bg-red-50 text-red-700 text-sm border border-red-100">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">访问密码</label>
        <input type="password" name="password" autofocus required class="input-field">
      </div>
      <button type="submit" class="btn-primary w-full">
        登录
      </button>
    </form>
  </div>
</div>
{% endblock %}
